<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AURA Browser AI Guard</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      font-size: 13px;
    }
    .header {
      padding: 14px 16px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 14px;
      color: #f8fafc;
    }
    .badge-status {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 9999px;
    }
    .status-active {
      background: rgba(34, 197, 94, 0.2);
      color: #86efac;
      border: 1px solid #22c55e;
    }
    .status-inactive {
      background: rgba(148, 163, 184, 0.2);
      color: #cbd5e1;
      border: 1px solid #64748b;
    }
    .content {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
    }
    .site-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .site-title {
      font-weight: 600;
      color: #38bdf8;
      font-size: 13px;
    }
    .site-domain {
      font-size: 12px;
      color: #94a3b8;
    }
    .stats-row {
      display: flex;
      justify-content: space-between;
      border-top: 1px solid #334155;
      padding-top: 8px;
      margin-top: 8px;
      font-size: 12px;
    }
    .btn {
      display: block;
      width: 100%;
      text-align: center;
      box-sizing: border-box;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 12.5px;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: background 0.15s;
    }
    .btn-primary {
      background: #3b82f6;
      color: white;
    }
    .btn-primary:hover {
      background: #2563eb;
    }
    .btn-secondary {
      background: #334155;
      color: #f1f5f9;
      margin-top: 6px;
    }
    .btn-secondary:hover {
      background: #475569;
    }
    .privacy-notice {
      font-size: 10.5px;
      color: #94a3b8;
      text-align: center;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span>🛡️</span>
      <span>AURA AI Guard</span>
    </div>
    <span id="popup-status-badge" class="badge-status status-inactive">Checking...</span>
  </div>

  <div class="content">
    <div class="card">
      <div class="site-info">
        <span id="popup-site-name" class="site-title">Detecting active page...</span>
        <span id="popup-site-domain" class="site-domain">—</span>
      </div>
      <div class="stats-row">
        <span>Protection Layer</span>
        <span id="popup-layer-status" style="color: #86efac; font-weight: 600;">Active In-Memory</span>
      </div>
    </div>

    <div>
      <button id="btn-open-dashboard" class="btn btn-primary">
        Open AURA Dashboard
      </button>
      <button id="btn-open-options" class="btn btn-secondary">
        Manage Configured Sites
      </button>
      <button id="btn-open-sandbox" class="btn btn-secondary">
        Launch Local Test Sandbox
      </button>
    </div>

    <div class="privacy-notice">
      🔒 In-memory pre-transfer inspection. Prompts and secrets are never stored or transmitted.
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
